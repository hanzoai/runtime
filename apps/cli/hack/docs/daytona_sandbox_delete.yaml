name: runtime sandbox delete
synopsis: Delete a sandbox
usage: runtime sandbox delete [SANDBOX_ID] [flags]
options:
  - name: all
    shorthand: a
    default_value: 'false'
    usage: Delete all sandboxes
  - name: force
    shorthand: f
    default_value: 'false'
    usage: Force delete
inherited_options:
  - name: help
    default_value: 'false'
    usage: help for runtime
see_also:
  - runtime sandbox - Manage Runtime sandboxes
