name: runtime volume create
synopsis: Create a volume
usage: runtime volume create [NAME] [flags]
options:
  - name: size
    shorthand: s
    default_value: '10'
    usage: Size of the volume in GB
inherited_options:
  - name: help
    default_value: 'false'
    usage: help for runtime
see_also:
  - runtime volume - Manage Runtime volumes
