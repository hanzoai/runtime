name: runtime
synopsis: Runtime CLI
description: Command line interface for Runtime Sandboxes
usage: runtime [flags]
options:
  - name: help
    default_value: 'false'
    usage: help for runtime
  - name: version
    shorthand: v
    default_value: 'false'
    usage: Display the version of Runtime
see_also:
  - runtime autocomplete - Adds a completion script for your shell environment
  - runtime docs - Opens the Runtime documentation in your default browser.
  - runtime login - Log in to Runtime
  - runtime logout - Logout from Runtime
  - runtime mcp - Manage Runtime MCP Server
  - runtime organization - Manage Runtime organizations
  - runtime sandbox - Manage Runtime sandboxes
  - runtime snapshot - Manage Runtime snapshots
  - runtime version - Print the version number
  - runtime volume - Manage Runtime volumes
