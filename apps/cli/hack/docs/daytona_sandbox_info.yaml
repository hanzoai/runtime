name: runtime sandbox info
synopsis: Get sandbox info
usage: runtime sandbox info [SANDBOX_ID] [flags]
options:
  - name: format
    shorthand: f
    usage: Output format. Must be one of (yaml, json)
  - name: verbose
    shorthand: v
    default_value: 'false'
    usage: Include verbose output
inherited_options:
  - name: help
    default_value: 'false'
    usage: help for runtime
see_also:
  - runtime sandbox - Manage Runtime sandboxes
